services:
  downloader-gui:
    build: .
    container_name: ytdlp-gui
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - HOST_DOWNLOAD_PATH=${HOST_DOWNLOAD_PATH:-/output}
    volumes:
      # Dostęp do gniazda Dockera – pozwala kontenerowi odpalać inne kontenery na hoście
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
